<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="22" fill="#09090b"/>
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="#23252c" stroke-width="2"/>
  <!-- Outer 12-segment cassette ring -->
  <circle cx="50" cy="50" r="39" stroke="#717684" stroke-width="4.5" stroke-dasharray="17.4 3.02" transform="rotate(-8 50 50)"/>
  <!-- Continuous guide ring -->
  <circle cx="50" cy="50" r="33" stroke="#525663" stroke-width="2"/>
  <!-- Mid-outer cog ring -->
  <circle cx="50" cy="50" r="27.5" stroke="#a0a6b5" stroke-width="4.5" stroke-dasharray="11.4 3.0" transform="rotate(-12 50 50)"/>
  <!-- Mid-inner cog ring -->
  <circle cx="50" cy="50" r="21" stroke="#cfd3dc" stroke-width="4.5" stroke-dasharray="8.2 2.8" transform="rotate(-12 50 50)"/>
  <!-- Signature Acid Volt teeth (upper-right quadrant, matching original ErgVibe mark) -->
  <path d="M 65.8 27.5 A 27.5 27.5 0 0 1 77.2 46.2" stroke="#a3e635" stroke-width="5.2" stroke-dasharray="11.2 2.8"/>
  <path d="M 62.1 32.8 A 21 21 0 0 1 70.8 47.1" stroke="#a3e635" stroke-width="5.2" stroke-dasharray="8.2 2.6"/>
  <!-- Inner bearing race with 2 gaps -->
  <circle cx="50" cy="50" r="13.5" stroke="#f4f5f8" stroke-width="4.5" stroke-dasharray="37.5 4.9" transform="rotate(-42 50 50)"/>
</svg>
